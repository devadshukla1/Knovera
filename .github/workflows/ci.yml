name: Knovera CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-qa:
    name: Backend Quality Assurance & RAG Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov coverage

      - name: Run Backend Unit, Security & E2E Tests
        run: |
          pytest -v --cov=backend/app --cov-report=term backend/tests/test_tenant_isolation_and_security.py backend/tests/test_storage.py backend/tests/test_config.py backend/tests/test_rag_e2e_evaluation.py backend/tests/test_ml_model_benchmarks.py backend/tests/test_e2e_user_journeys.py backend/tests/test_security_audit.py

      - name: Run ML Model Benchmarks & RAG Benchmark
        run: |
          python backend/scripts/evaluate_rag_e2e.py
          python backend/scripts/benchmark_ml_models.py

  frontend-qa:
    name: Frontend Quality Assurance & Typecheck
    # The current lockfile includes direct Windows-native build dependencies.
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Typecheck and Build Bundle
        run: npm --prefix frontend run build

      - name: Run Vitest Component & Unit Tests
        run: npm --prefix frontend test
