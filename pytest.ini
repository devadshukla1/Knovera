[pytest]
testpaths = backend/tests
pythonpath = . backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -p no:warnings
markers =
    unit: Isolated unit tests exercising standalone classes or functions
    integration: Integration tests between components or subsystems
    api: FastAPI endpoint tests using TestClient
    security: Multi-tenant boundary, authentication, and authorization tests
    rag: Retrieval-Augmented Generation retrieval and generation tests
    ml: Machine learning, topic modeling, clustering, and BKT tests
    slow: Long-running or heavy computational tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
